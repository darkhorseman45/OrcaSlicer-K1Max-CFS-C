# K1MAX-CFS-C-INSTALLER: reversible user-space Fluidd configuration.
worker_processes 1;
pid /usr/data/fluidd/nginx/nginx.pid;
error_log /usr/data/fluidd/nginx/error.log warn;
events { worker_connections 128; }
http {
    types { text/html html; text/css css; application/javascript js; application/json json; image/jpeg jpg jpeg; image/png png; image/svg+xml svg; font/woff2 woff2; }
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    upstream k1max_ws {
        server 127.0.0.1:7126 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:7125 backup;
    }
    server {
        listen 4408;
        server_name _;
        root /usr/data/k1max-cfs-c/ui;
        index index.html;
        location /websocket {
            proxy_pass http://k1max_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
        location ~ ^/(printer|server|machine|access|api|debug|history|files|webcam)/ {
            proxy_pass http://127.0.0.1:7125;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
            client_max_body_size 1024m;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}