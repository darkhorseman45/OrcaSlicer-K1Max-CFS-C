name: Build OrcaSlicer 2.4.2 K1 Max CFS-C

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout OrcaSlicer 2.4.2
        uses: actions/checkout@v4
        with:
          repository: OrcaSlicer/OrcaSlicer
          ref: v2.4.2
          path: OrcaSlicer
          submodules: recursive
          lfs: true
          persist-credentials: false

      - name: Apply K1 Max CFS-C source patch
        shell: pwsh
        working-directory: OrcaSlicer
        run: |
          $patchBase64 = ""
          [IO.File]::WriteAllBytes('k1max-cfs-c.patch', [Convert]::FromBase64String($patchBase64))
          git apply --check k1max-cfs-c.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch does not match v2.4.2 source; build stopped.' }
          git apply k1max-cfs-c.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch application failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace errors in patch.' }

      - name: Configure Visual Studio 2022 build tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build dependencies and patched OrcaSlicer
        shell: cmd
        working-directory: OrcaSlicer
        run: call build_release_vs.bat

      - name: Confirm compiled application
        shell: pwsh
        run: |
          if (!(Test-Path 'OrcaSlicer/build/OrcaSlicer')) { throw 'Installed portable app folder not found.' }
          $exe = Get-ChildItem 'OrcaSlicer/build/OrcaSlicer' -Filter '*.exe' -Recurse | Select-Object -First 1
          if (!$exe) { throw 'No compiled executable found.' }
          Write-Output $exe.FullName

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: OrcaSlicer-2.4.2-K1Max-CFS-C-Windows
          path: OrcaSlicer/build/OrcaSlicer/
          if-no-files-found: error
          retention-days: 7
