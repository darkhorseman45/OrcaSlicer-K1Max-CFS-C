name: Build OrcaSlicer 2.4.2 K1 Max CFS-C

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout launcher files from this repository
        uses: actions/checkout@v4
        with:
          path: CustomLauncher

      - name: Checkout OrcaSlicer 2.4.2
        uses: actions/checkout@v4
        with:
          repository: OrcaSlicer/OrcaSlicer
          ref: v2.4.2
          path: OrcaSlicer
          submodules: recursive
          lfs: true
          persist-credentials: false

      - name: Add K1 Max CFS-C support
        shell: pwsh
        working-directory: OrcaSlicer
        run: |
          $file = 'src/slic3r/Utils/CrealityPrint.cpp'
          $source = [System.IO.File]::ReadAllText((Resolve-Path $file))
          $changes = @(
            @{
              Old = '|| m_model == "F022";   // SPARKX i7'
              New = '|| m_model == "F022"    // SPARKX i7' + "`n" + '        || m_model == "K1 Max_CFS-C"; // K1 Max with native CFS-C'
            },
            @{
              Old = '{"F022", "SPARKX i7"},'
              New = '{"F022", "SPARKX i7"},' + "`n" + '        {"K1 Max_CFS-C", "K1 Max CFS-C"},'
            },
            @{
              Old = 'const std::string gcode_path = "/mnt/UDISK/printer_data/gcodes/" + filename;'
              New = 'const std::string gcode_path = (m_model == "K1 Max_CFS-C" ? "/usr/data" : "/mnt/UDISK") + std::string("/printer_data/gcodes/") + filename;'
            }
          )
          foreach ($change in $changes) {
            $count = ([regex]::Matches($source, [regex]::Escape($change.Old))).Count
            if ($count -ne 1) { throw "Expected exactly one matching source statement but found $count : $($change.Old)" }
            $source = $source.Replace($change.Old, $change.New)
          }
          [System.IO.File]::WriteAllText((Resolve-Path $file), $source, [System.Text.UTF8Encoding]::new($false))
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Source change whitespace check failed.' }
          git diff --stat
          Select-String -Path $file -Pattern 'K1 Max_CFS-C'

      - name: Configure Visual Studio 2022 build tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build dependencies and patched OrcaSlicer
        shell: cmd
        working-directory: OrcaSlicer
        run: call build_release_vs.bat

      - name: Confirm compiled application
        shell: pwsh
        run: |
          if (!(Test-Path 'OrcaSlicer/build/OrcaSlicer')) { throw 'Installed portable app folder not found.' }
          $exe = Get-ChildItem 'OrcaSlicer/build/OrcaSlicer' -Filter '*.exe' -Recurse | Select-Object -First 1
          if (!$exe) { throw 'No compiled executable found.' }
          Write-Output $exe.FullName

      - name: Build Fluidd Windows launcher
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          if (!(Test-Path $csc)) { throw 'Windows .NET Framework C# compiler not found' }
          $source = 'CustomLauncher/FluiddLauncher/FluiddLauncher.cs'
          if (!(Test-Path $source)) { throw 'Missing FluiddLauncher.cs in repository' }
          $out = 'OrcaSlicer/build/OrcaSlicer/K1Max-CFS-C-Launcher.exe'
          & $csc /nologo /target:winexe /optimize+ /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /out:$out $source
          if ($LASTEXITCODE -ne 0) { throw 'Fluidd launcher compilation failed' }
          $plinkUrl = 'https://the.earth.li/~sgtatham/putty/latest/w64/plink.exe'
          Invoke-WebRequest -Uri $plinkUrl -OutFile 'OrcaSlicer/build/OrcaSlicer/plink.exe'
          if (!(Test-Path 'OrcaSlicer/build/OrcaSlicer/plink.exe')) { throw 'Could not bundle plink.exe' }

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: OrcaSlicer-2.4.2-K1Max-CFS-C-Fluidd-Windows
          path: OrcaSlicer/build/OrcaSlicer/
          if-no-files-found: error
          retention-days: 7
