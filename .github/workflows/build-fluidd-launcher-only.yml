name: Build Fluidd launcher only

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-fluidd-launcher-only.yml'
      - 'FluiddLauncher/FluiddLauncher.cs'

permissions:
  contents: read

jobs:
  build-launcher:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout launcher sources
        uses: actions/checkout@v4

      - name: Patch Plink host-key handling and compile launcher
        shell: pwsh
        run: |
          $src = (Resolve-Path -LiteralPath 'FluiddLauncher/FluiddLauncher.cs').ProviderPath
          $text = [System.IO.File]::ReadAllText($src)
          $invalid = '-connect-timeout 5 '
          if ($text.Contains($invalid)) { $text = $text.Replace($invalid, '') }
          # Plink must not run in batch mode if its host-key confirmation is to be answered.
          $text = $text.Replace('-ssh -batch -noagent', '-ssh -noagent')
          $text = $text.Replace('RedirectStandardError = true,', 'RedirectStandardInput = true,' + [Environment]::NewLine + '                        RedirectStandardError = true,')
          $text = $text.Replace('p.Start();', 'p.Start();' + [Environment]::NewLine + '                    p.StandardInput.WriteLine("y");' + [Environment]::NewLine + '                    p.StandardInput.Close();')
          if (!$text.Contains('p.StandardInput.WriteLine("y");')) { throw 'Failed to patch confirmation input' }
          [System.IO.File]::WriteAllText($src, $text)
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          if (!(Test-Path $compiler)) { throw 'Windows .NET Framework compiler not found' }
          & $compiler /nologo /target:winexe /optimize+ /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /out:dist/K1Max-CFS-C-Launcher.exe $src
          if ($LASTEXITCODE -ne 0) { throw 'Launcher compilation failed' }

      - name: Verify rebuilt launcher artifact
        shell: pwsh
        run: |
          $exe = 'dist/K1Max-CFS-C-Launcher.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'Launcher executable was not produced' }
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -lt 4096) { throw 'Launcher executable is unexpectedly small' }
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $exe
          Write-Output "Rebuilt launcher size: $($item.Length) bytes"
          Write-Output "SHA256: $($hash.Hash)"

      - name: Upload fixed launcher
        uses: actions/upload-artifact@v4
        with:
          name: K1Max-CFS-C-Launcher-AutoHostKey
          path: dist/K1Max-CFS-C-Launcher.exe
          if-no-files-found: error
          retention-days: 7
