name: Build updated secure K1 Max CFS-C Fluidd launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'FluiddLauncher/FluiddLauncher.cs'
      - '.github/workflows/build-fluidd-launcher-only.yml'

permissions:
  contents: read

jobs:
  build-launcher:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile password-configurable launcher (no embedded printer IP)
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          if (!(Test-Path $compiler)) { throw 'Windows .NET Framework C# compiler not found' }
          $source = 'FluiddLauncher/FluiddLauncher.cs'
          if (!(Test-Path $source)) { throw "Missing launcher source: $source" }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & $compiler /nologo /target:winexe /optimize+ /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Security.dll /out:dist/K1Max-CFS-C-Launcher.exe $source
          if ($LASTEXITCODE -ne 0) { throw 'Launcher C# compilation failed' }
          $item = Get-Item 'dist/K1Max-CFS-C-Launcher.exe'
          if ($item.Length -lt 4096) { throw 'Compiled launcher unexpectedly small' }
          Get-FileHash 'dist/K1Max-CFS-C-Launcher.exe' -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: K1Max-CFS-C-Launcher-Configurable
          path: dist/K1Max-CFS-C-Launcher.exe
          if-no-files-found: error
          retention-days: 30